[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2-claude-code"
version = "0.1.0"
description = "Harness² (Recursive Agent Harnessing) ported to Claude Code: optimise CLAUDE.md, skills, subagents, scripts and hooks with a fixed model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness2 = "harness2.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["harness2*"]

[tool.setuptools.package-data]
harness2 = ["base_harness/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runs", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
